name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 3 * * *"   # roda todo dia às 03:00 UTC
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Card de atividade (enxuto)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Gerson-if
          template: classic
          base: header, activity, community
          theme: github-dark-dimmed
          config_timezone: America/Campo_Grande
          filename: generated/overview.svg

      - name: Card de linguagens (isolado)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Gerson-if
          template: classic
          base: ""
          theme: github-dark-dimmed
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_threshold: 2%
          filename: generated/languages.svg
