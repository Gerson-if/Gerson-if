name: Gerar dashboard de métricas

on:
  schedule:
    - cron: "0 5 * * *"   # roda todo dia às 05:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar dashboard (SVG animado)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: Gerson-if
        run: node scripts/generate-dashboard-svg.mjs

      - name: Remover PNG antigo (se existir)
        run: rm -f generated/dashboard.png

      - name: Commitar dashboard atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A generated
          git diff --staged --quiet || git commit -m "Atualiza dashboard animada [skip ci]"
          git push
